name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Smoke test the executable jar
        run: java -Djava.awt.headless=true -jar target/personal-budget-book.jar --smoke-test

      - uses: actions/upload-artifact@v6
        with:
          name: personal-budget-book
          path: target/personal-budget-book.jar
          if-no-files-found: error
